name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and alone. If the triage rules are wrong, nothing else matters.
  safety:
    name: Fever rules safety table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the fever rules safety table
        run: node --experimental-strip-types --test packages/fever-rules/src/index.test.ts
      - name: Run the Ask triage guard tests
        run: node --experimental-strip-types --test packages/shared/src/triage-guard.test.ts
      - name: Block rules changes that ship without test changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -q 'packages/fever-rules/src/index.ts'; then
            if ! echo "$CHANGED" | grep -q 'packages/fever-rules/src/index.test.ts'; then
              echo "::error::You changed the fever rules without changing the test table."
              echo "See docs/SAFETY.md. A rules change needs matching test cases."
              exit 1
            fi
          fi

  web:
    name: Web app
    runs-on: ubuntu-latest
    needs: safety
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install, not npm ci: there is no lockfile until apps/web is
      # scaffolded in Week 1. Switch to `npm ci` + cache once one exists.
      - name: Install
        run: npm install --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run test --if-present

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for committed secrets
        run: |
          # Deliberately simple. The gitleaks action needs a paid licence for
          # organisation repos; this has no licence gate and catches the shapes
          # that actually get committed by accident. Note the `.+` — an empty
          # KEY= in .env.example is fine, a filled one is not.
          PATTERN='sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(OPENAI_API_KEY|SUPABASE_SERVICE_ROLE_KEY|AI_SERVICE_TOKEN|SENTRY_DSN)=.+'
          if grep -rInE "$PATTERN" \
              --exclude-dir=.git --exclude-dir=node_modules \
              --exclude-dir=_to_delete --exclude='*.md' . ; then
            echo "::error::Possible secret committed. Move it to an environment variable."
            exit 1
          fi
          echo "No secrets found."
