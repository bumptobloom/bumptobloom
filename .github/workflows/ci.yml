name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and alone. If the triage rules are wrong, nothing else matters.
  safety:
    name: Fever rules safety table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the safety test table
        run: node --experimental-strip-types --test packages/fever-rules/src/index.test.ts
      - name: Block rules changes that ship without test changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -q 'packages/fever-rules/src/index.ts'; then
            if ! echo "$CHANGED" | grep -q 'packages/fever-rules/src/index.test.ts'; then
              echo "::error::You changed the fever rules without changing the test table."
              echo "See docs/SAFETY.md. A rules change needs matching test cases."
              exit 1
            fi
          fi

  web:
    name: Web app
    runs-on: ubuntu-latest
    needs: safety
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run test --if-present

  ai:
    name: AI service
    runs-on: ubuntu-latest
    needs: safety
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
