name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and alone. If the triage rules are wrong, nothing else matters.
  safety:
    name: Fever rules safety table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone. The rules-vs-tests guard below
          # uses a three-dot diff, which needs a merge base to exist.
          # Melvin fixed this in e70fcd9 — don't shallow it again.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the fever rules safety table
        run: node --experimental-strip-types --test packages/fever-rules/src/index.test.ts
      - name: Run the Ask triage guard tests
        run: node --experimental-strip-types --test packages/shared/src/triage-guard.test.ts
      - name: Block rules changes that ship without test changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -q 'packages/fever-rules/src/index.ts'; then
            if ! echo "$CHANGED" | grep -q 'packages/fever-rules/src/index.test.ts'; then
              echo "::error::You changed the fever rules without changing the test table."
              echo "See docs/SAFETY.md. A rules change needs matching test cases."
              exit 1
            fi
          fi

  web:
    name: Web app
    runs-on: ubuntu-latest
    needs: safety
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install, not npm ci: there is no lockfile committed until the
      # Next.js app is fully scaffolded in Week 1. Switch to `npm ci` plus
      # `cache: npm` on the setup-node step once package-lock.json lands.
      - run: npm install
      - run: npm run lint --if-present
      - run: npm run test --if-present
      # `next build` type-checks the app itself, and it has to: some of the
      # types it checks against (LayoutProps, PageProps) are generated during
      # the build, so a standalone `tsc --noEmit` before it fails on types
      # that do not exist yet.
      - run: npm run build --if-present

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gitleaks-action needs a paid licence key for organisation repos, so
      # this is a deliberately simple grep. It catches the mistake we actually
      # expect: a real key pasted into a file instead of read from env.
      - name: Look for hardcoded keys
        run: |
          if grep -rInE \
            '(sk-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{20,})' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            --include='*.json' --include='*.sql' --include='*.yml' --include='*.md' \
            . ; then
            echo "::error::That looks like a real API key or JWT in the diff."
            echo "Secrets go in Vercel env vars and .env.local, never in a file."
            exit 1
          fi
          echo "No hardcoded keys found."
      - name: Look for server-only names exposed to the browser
        run: |
          if grep -rInE 'NEXT_PUBLIC_[A-Z_]*(OPENAI|SERVICE_ROLE|SECRET|PRIVATE)' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            --include='*.json' . ; then
            echo "::error::NEXT_PUBLIC_* is shipped to the browser and visible in devtools."
            echo "OPENAI_API_KEY and SUPABASE_SECRET_KEY are server-side only."
            exit 1
          fi
          echo "No server-only secrets exposed via NEXT_PUBLIC_."

  rls:
    name: RLS isolation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the RLS checker catches missing sentinels
        run: python3 supabase/tests/test_btb_rls_check.py
      - name: Verify private-row isolation through the public API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RLS_TEST_A_PASSWORD: ${{ secrets.RLS_TEST_A_PASSWORD }}
          RLS_TEST_B_PASSWORD: ${{ secrets.RLS_TEST_B_PASSWORD }}
        run: python3 supabase/tests/btb_rls_check.py

  # #72: the Ask rate limiter and its audit events, driven through the real
  # /api/ask route over HTTP against a throwaway local Supabase and a fake
  # OpenAI that always rejects. No repository secret is involved: the keys come
  # from `supabase status` at runtime and are the CLI's public local defaults.
  # They are deliberately never written into this file -- the secret scan above
  # would (rightly) reject an sb_secret_ literal.
  ask-limiter:
    name: Ask limiter (route + database)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Installed straight from the official release, pinned and checksum
      # verified, rather than through a third-party setup action: fewer moving
      # parts on every PR, and the same steps we ran by hand.
      - name: Install the Supabase CLI (pinned, checksum-verified)
        env:
          SUPABASE_CLI_VERSION: 2.117.0
        run: |
          set -euo pipefail
          base="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          asset="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${asset}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" supabase
          sudo install -m 0755 "$RUNNER_TEMP/supabase" /usr/local/bin/supabase
          supabase --version
      # supabase/config.toml is not committed, so generate the default one.
      # storage-api stays running because migration 0002 creates a storage
      # bucket; everything Ask does not touch is left out to keep this fast.
      - name: Start a throwaway local Supabase
        run: |
          [ -f supabase/config.toml ] || supabase init
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,mailpit,realtime,supavisor
      - name: Export the local settings to the rest of the job
        run: |
          set -euo pipefail
          # Keep only KEY=value lines: anything else would be executed below.
          supabase status -o env | grep -E '^[A-Z0-9_]+=' > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "OPENAI_API_KEY=ci-fake-openai-key"
            echo "OPENAI_BASE_URL=http://127.0.0.1:9999/v1"
          } >> "$GITHUB_ENV"
      - name: Database check (reserve_ask_attempt)
        run: node --experimental-strip-types supabase/tests/ask_rate_limit_check.ts
      - name: Build and start the app
        run: |
          npm run build --workspace=apps/web
          nohup npm run start --workspace=apps/web > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 2
          done
          echo "::error::the app did not start"
          cat "$RUNNER_TEMP/app.log"
          exit 1
      - name: Route check (/api/ask)
        run: node --experimental-strip-types supabase/tests/ask_route_check.ts
      - name: App log
        if: failure()
        run: cat "$RUNNER_TEMP/app.log" || true
